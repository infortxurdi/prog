<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Conceptos de Programación</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

    <!-- 1. Estilo para colapsar/desplegar el menú lateral -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
</head>

<body>
    <div id="app"></div>
    <script>
        // Si se entra a la raíz sin idioma, redirige a /eu/
        if (!window.location.hash || window.location.hash === '#/') {
            window.location.hash = '#/eu/';
        }
    </script>
    <script>
        window.$docsify = {
            name: 'Prog - Infortxurdi',
            repo: 'https://github.com/infortxurdi/prog',
            loadSidebar: true,
            subMaxLevel: 2,
            sidebarDisplayLevel: 0,

            alias: {
                '/eu/(.*)/_sidebar.md': '/eu/_sidebar.md',
                '/es/(.*)/_sidebar.md': '/es/_sidebar.md'
            },
            
            // Idioma de respaldo si la ruta no existe
            fallbackLanguages: ['eu'],

            // Enlace del logo/nombre según el idioma

            nameLink: {
                '/es/': '#/es/',
                '/eu/': '#/eu/',
                '/': '#/eu/'
            },

            // Buscador adaptado a varios idiomas
            search: {
                placeholder: {
                    '/es/': 'Buscar...',
                    '/eu/': 'Bilatu...',
                    '/': 'Bilatu...'
                },
                noData: {
                    '/es/': 'Sin resultados',
                    '/eu/': 'Emaitzarik ez',
                    '/': 'Emaitzarik ez'
                },
                pathNamespaces: ['/es', '/eu']
            }
        }
    </script>
    <!-- Núcleo de Docsify -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <!-- Buscador -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <!-- Resaltado de sintaxis Java -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>

    <!-- 2. Plugin para permitir desplegar/plegar temas al hacer clic -->
    <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>

</html>
